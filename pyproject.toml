[project]
name = "baselinereproduction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "albumentationsx>=2.4.10",
    "einops>=0.8.2",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "prettytable>=3.18.0",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
    "torch>=2.5.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.20.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
